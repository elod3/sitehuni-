<script>
/* Starea de pornire, înainte de primul paint: animațiile doar fără „reduce motion”;
   cortina rămâne închisă când venim dintr-o tranziție; loaderul doar la prima vizită. */
(function () {
  var d = document.documentElement;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  d.classList.add('js-motion');
  try {
    if (sessionStorage.getItem('arc-nav')) d.classList.add('is-arriving');
    else if (!sessionStorage.getItem('arc-seen')) d.classList.add('is-loading');
  } catch (e) {}
})();
</script>
